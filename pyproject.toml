[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crossflow-simulator"
version = "0.2.0"
description = "Reduced-order simulator for material cross-sections in low-Reynolds-number microfluidic flow sculpting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "pyamg>=5.0,<6",  # AMG block preconditioner for the Stokes solver (block-LU fallback without it)
]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7"]
fast = ["numba>=0.60"]  # optional compiled streamline kernel (NumPy reference path without it)
dev = ["pytest>=8"]

[project.scripts]
crossflow = "crossflow_simulator.cli:main"

[project.gui-scripts]
crossflow-gui = "crossflow_simulator.gui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
# Only the new implementation under src/ is packaged. The frozen snapshot in
# legacy/python/ is executed by an isolated worker and never joins this namespace.
where = ["src"]
include = ["crossflow_simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "slow: long-running numerical or packaging checks",
    "gui: requires PySide6 (runs offscreen)",
    "legacy: runs the frozen legacy solver in an isolated worker",
]
