name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      CROSSFLOW_DISABLE_DISK_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
          python -m pip install --no-deps -e .
      - name: Legacy snapshot and migration
        run: python -m crossflow_simulator verify-snapshot
      - name: Original tests against the frozen snapshot
        run: python -m crossflow_simulator legacy-tests
      - name: Test suite
        run: python -m pytest -q
      - name: Analytical references
        run: python -m crossflow_simulator validate-references reference_data/analytical
